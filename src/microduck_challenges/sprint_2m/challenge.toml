# The 2 m Sprint: walk a flat 2 m lane as fast as possible. The Arena races the
# policy at forward commands from 0.20 to 1.20 m/s and keeps its best.
event = "sprint-2m"
task  = "Mjlab-Sprint2m-MicroDuck"
kind  = "perpetual"

[recipe]                  # the first training, as is
num_envs       = 4096
max_iterations = 3000
seed           = 1

[params.forward_reward]
label = "Follow the speed order"
value = 0.0                # race variant: the reward ignores the command
min   = 0.0
max   = 5.0

[params.upright_reward]
label = "Stay upright"
value = 0.1                # race variant: the Arena's fall rule judges tilt; this stays small
min   = 0.0
max   = 5.0

[params.step_reward]
label = "Lift your feet"
value = 0.0                # race variant: no gait shaping
min   = 0.0
max   = 6.0
